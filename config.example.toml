# Template for the optional TOML configuration file, passed via
# `--config <path>` (or the CONFIG environment variable).
#
# The flag is optional: with no config file (or one containing no orchestrator
# entries) every asset is vault-direct, which is the dark-deploy default.
#
# Parsing is strict — unknown keys and invalid vault_mode strings are startup
# errors, and any asset resolving to orchestrator mode while
# [orchestrator.addresses] is missing or malformed is a startup error.

[orchestrator]
# Mode for assets without a per-asset override below:
# "vault_direct" (the default when omitted) | "orchestrator".
# The full-rollout end state sets this to "orchestrator" and drops the
# per-asset overrides, so newly onboarded assets default to the orchestrator.
default_vault_mode = "vault_direct"

# ST0xOrchestrator contract addresses, one per network — each chain carries
# its own deployment. Keys are network wire names: base | ethereum | hyperevm.
# Required when any asset resolves to orchestrator mode: at startup every
# configured chain must have an entry (a missing, malformed, zero-address, or
# unknown-network entry is a startup error).
[orchestrator.addresses]
base = "0x1234567890abcdef1234567890abcdef12345678"
ethereum = "0x2222222222222222222222222222222222222222"
hyperevm = "0x3333333333333333333333333333333333333333"

# Per-asset override, keyed by underlying symbol. The mode is keyed by symbol
# alone — it applies on every network the asset is listed on; the address is
# what varies per network. During the pilot exactly one asset carries this;
# every other asset stays on the default.
[assets.RKLB]
vault_mode = "orchestrator"

# Wrapped-token (ERC-4626 wrapper) contract addresses, one table per network
# (base | ethereum | hyperevm), keyed by underlying symbol. Inbound transfers
# of these tokens to the issuer wallet cannot be redeemed, so the per network
# watcher records them and alerts the operator (see SPEC.md "Per network
# monitoring"). Every listed network must have a chain configuration; a
# configured chain with no table here has wrapped-token watching disabled
# (startup WARN). Unknown networks, invalid symbols, malformed or zero
# addresses, and one address bound to two symbols on a chain are startup
# errors. This example lists every chain the bot can run; remove the table for
# any chain this deployment does not configure, or startup fails.
[wrapped_tokens.base]
RKLB = "0xabcdefabcdefabcdefabcdefabcdefabcdefabcd"

[wrapped_tokens.ethereum]
RKLB = "0xbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"

[wrapped_tokens.hyperevm]
RKLB = "0xcccccccccccccccccccccccccccccccccccccccc"
