name: Rainix CI

on:
  push:
    branches-ignore:
      - 'graphite-base/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}-rainix
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: "sqlite:issuance.db"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be  # v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c  # v35
        with:
          # Nix 2.24-2.28 fail to resolve rainix's overridden `foundry` input
          # (`cannot find flake 'flake:foundry'`); the fix landed in 2.30. v30
          # of this action only shipped up to 2.26, so use v35 and pin a
          # working release.
          nix_version: "2.31.5"
          nix_conf: |
            accept-flake-config = true
            fallback = true
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            keep-env-derivations = true
            keep-outputs = true

      # Shared rainlanguage Cachix that raindex CI populates; read works
      # anonymously (the cache is public), pushes need CACHIX_AUTH_TOKEN.
      - uses: cachix/cachix-action@ad2ddac53f961de1989924296a1f236fcfbaa4fc  # v15
        continue-on-error: true
        with:
          name: rainlanguage
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          useDaemon: false

      # github.job in the key keeps test and static from racing for the same
      # immutable save key (first saver would win and the other job's store
      # diff would never be cached); the bare OS prefix stays as a cross-job
      # fallback restore.
      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569  # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: |
            nix-${{ runner.os }}-${{ github.job }}-
            nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          prefix-key: rust-${{ github.workflow }}

      - run: nix flake check

      - run: nix develop -c sqlx db create
      - run: nix develop -c sqlx migrate run

      - name: Run tests
        run: nix develop -c cargo test --workspace

  static:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: "sqlite:issuance.db"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be  # v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c  # v35
        with:
          # Nix 2.24-2.28 fail to resolve rainix's overridden `foundry` input
          # (`cannot find flake 'flake:foundry'`); the fix landed in 2.30. v30
          # of this action only shipped up to 2.26, so use v35 and pin a
          # working release.
          nix_version: "2.31.5"
          nix_conf: |
            accept-flake-config = true
            fallback = true
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            keep-env-derivations = true
            keep-outputs = true

      # Shared rainlanguage Cachix that raindex CI populates; read works
      # anonymously (the cache is public), pushes need CACHIX_AUTH_TOKEN.
      - uses: cachix/cachix-action@ad2ddac53f961de1989924296a1f236fcfbaa4fc  # v15
        continue-on-error: true
        with:
          name: rainlanguage
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          useDaemon: false

      # github.job in the key keeps test and static from racing for the same
      # immutable save key (first saver would win and the other job's store
      # diff would never be cached); the bare OS prefix stays as a cross-job
      # fallback restore.
      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569  # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: |
            nix-${{ runner.os }}-${{ github.job }}-
            nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          prefix-key: rust-${{ github.workflow }}

      - run: nix run .#prepSolArtifacts
      - run: nix flake check

      - run: nix develop -c sqlx db create
      - run: nix develop -c sqlx migrate run

      - name: Check formatting
        run: nix develop -c cargo fmt --all -- --check

      - name: Run clippy
        run: nix develop -c cargo clippy --workspace --all-targets --all-features -- -D clippy::all -D warnings
