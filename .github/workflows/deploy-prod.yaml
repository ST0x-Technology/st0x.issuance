name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to deploy (must be on main)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    environment: production
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be  # v1.3.1

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          submodules: recursive

      - name: Verify tag is on main
        run: |
          git fetch --tags origin main
          if ! git rev-parse -q --verify "refs/tags/${{ inputs.tag }}" >/dev/null; then
            echo "ERROR: '${{ inputs.tag }}' is not an existing tag" >&2
            exit 1
          fi
          tag_commit="$(git rev-list -n 1 "refs/tags/${{ inputs.tag }}")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "ERROR: tag ${{ inputs.tag }} is not on main" >&2
            exit 1
          fi

      # nix-quick-install + rainlanguage Cachix + per-runner store cache replace
      # the Determinate installer + magic-nix-cache (EOL'd upstream: it fails
      # FlakeHub auth and caches nothing) and share the cache raindex CI populates.
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c  # v35
        with:
          # Nix 2.24-2.28 fail to resolve rainix's overridden `foundry` input
          # (`cannot find flake 'flake:foundry'`); the fix landed in 2.30. v30
          # of this action only shipped up to 2.26, so use v35 and pin a
          # working release.
          nix_version: "2.31.5"
          nix_conf: |
            accept-flake-config = true
            fallback = true
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            keep-env-derivations = true
            keep-outputs = true

      # Shared rainlanguage Cachix that raindex CI populates; read works
      # anonymously (the cache is public), pushes need CACHIX_AUTH_TOKEN.
      - uses: cachix/cachix-action@ad2ddac53f961de1989924296a1f236fcfbaa4fc  # v15
        continue-on-error: true
        with:
          name: rainlanguage
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          useDaemon: false

      # Cargo.lock is in the key (unlike CI's) because the deploy builds the
      # service closure with crane: a dependency bump changes the vendored-deps
      # derivations, and without a key miss the post-run save is skipped and
      # those layers would be rebuilt on every deploy.
      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569  # v7.0.2
        with:
          primary-key: nix-deploy-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock', '**/Cargo.lock') }}
          restore-prefixes-first-match: nix-deploy-${{ runner.os }}-
          gc-max-store-size-linux: 5G

      # The deploy script resolves the droplet IP from infra/.remote-prod.age
      # (encrypted to roles.prod.ssh, which includes the CI key) and pins the
      # host key from keys.nix into known_hosts itself.
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Deploy all profiles
        run: nix run .#prodDeployAll

      - name: Cleanup SSH
        if: always()
        run: rm -rf ~/.ssh/id_ed25519
