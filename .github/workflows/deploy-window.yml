name: deploy-window
# Asks PAM for a production deploy window on s01-issuance: two approvers
# approve it ahead of time, and every release inside it rolls without a new
# approval (ST0x-Technology/.github deploy-window.yml). Loopyloupe starts
# this with the GitHub sign-in of whoever asked, so the run names them;
# anyone with write access can start it by hand (Actions > deploy-window >
# Run workflow, on main).
on:
  workflow_dispatch:
    inputs:
      start:
        description: "Window start in UTC, like 2026-10-22T13:00:00Z (5 minutes to 7 days ahead)"
        required: true
        type: string
      hours:
        description: "Window length in whole hours, 1 to 12"
        required: true
        type: string
      reason:
        description: "Why, in one line"
        required: true
        type: string

permissions:
  contents: read

jobs:
  request:
    permissions:
      id-token: write
      contents: read
    uses: ST0x-Technology/.github/.github/workflows/deploy-window.yml@4a1d2d28716072aa77c3038f9cf6d58bea5a2e9c # deploy-window @ .github main
    with:
      project: s01-issuance
      service_account: issuance-releaser@s01-artifacts.iam.gserviceaccount.com
      wif_provider: projects/47686631938/locations/global/workloadIdentityPools/github-actions/providers/github-oidc
      start: ${{ inputs.start }}
      hours: ${{ inputs.hours }}
      reason: ${{ inputs.reason }}
