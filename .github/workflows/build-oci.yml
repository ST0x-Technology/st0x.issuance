name: build-oci

# Issuance bot OCI image -> s01-artifacts Artifact Registry (s01-issuance
# repo): nix build the flake's dockerTools image -> smoke test -> push
# digest -> sign (GitHub/Sigstore + the s01-artifacts issuance-image KMS
# attestor) -> roll staging once the GCP staging VM exists.
#
# A MERGE TO MAIN DEPLOYS GCP STAGING (roll-staging job at the bottom): the
# shared app-release workflow (ST0x-Technology/.github) publishes
# config.staging.toml as a version of the staging runtime-config secret and
# writes the digest + that version into the images.env object the staging
# VM's roll timer polls. The VM verifies the issuance-image attestation of
# everything it adopts, so this job cannot make it run an unsigned image.
# Its rights on the staging project come from the devops side (write on
# images.env, publish config versions); without them the job fails at the
# write, which is the honest answer once staging exists.
#
# Auth: GitHub OIDC -> the s01-artifacts WIF provider, bound to
# issuance-deployer (main only; the WIF binding lives in s01.devops
# terraform/artifacts/issuance.tf). PRs get nothing. The provider path,
# deployer SA and attestor are the s01.devops artifacts stack's outputs;
# they change only if that project is rebuilt.
#
# Coexists with deploy-staging.yaml / deploy-prod.yaml (the DigitalOcean
# deploy-rs path) until the staging cutover retires the staging half.
#
# Production is deployed from this repo too, but never by this workflow:
# release-tag.yml (a version tag) and production-release.yml (a config
# merge or a rollback dispatch) run the same shared workflow as
# issuance-releaser behind the production project's app-deploy PAM grant.

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: build-oci
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  # GitHub/Sigstore provenance attestation on every pushed digest.
  attestations: write

env:
  REGION: europe-west3
  AR_REPO: europe-west3-docker.pkg.dev/s01-artifacts/s01-issuance
  WIF_PROVIDER: projects/47686631938/locations/global/workloadIdentityPools/github-actions/providers/github-oidc
  DEPLOYER_SA: issuance-deployer@s01-artifacts.iam.gserviceaccount.com
  ATTESTOR: projects/s01-artifacts/attestors/issuance-image
  # Local docker name the flake's streamLayeredImage loads as
  # (nix/oci-image.nix `name`) and the AR image name; the same string on
  # purpose.
  IMAGE: s01-issuance

jobs:
  build-push:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be  # v1.3.1

      # Same pins as rainix.yaml / deploy-*.yaml, for the reason recorded
      # there (Nix 2.24-2.28 cannot resolve rainix's overridden `foundry`
      # input; 2.31.5 on v35 works). One toolchain for CI and the release
      # image.
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c  # v35
        with:
          nix_version: "2.31.5"
          nix_conf: |
            accept-flake-config = true
            fallback = true
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            keep-env-derivations = true
            keep-outputs = true

      - uses: cachix/cachix-action@ad2ddac53f961de1989924296a1f236fcfbaa4fc  # v15
        continue-on-error: true
        with:
          name: rainlanguage
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          useDaemon: false

      # Restores the deploy/test caches on a key miss (same crane
      # cargoArtifacts for the same Cargo.lock), saves under its own key,
      # and stays inside the siblings' 5G cap so a save never evicts them.
      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569  # v7
        with:
          primary-key: nix-oci-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock', 'Cargo.lock') }}
          restore-prefixes-first-match: |
            nix-oci-${{ runner.os }}-
            nix-deploy-${{ runner.os }}-
            nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G

      - name: Authenticate to GCP
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed  # v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f  # v2
        with:
          # `container binauthz` lives in the beta component.
          install_components: beta

      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build OCI image from the flake
        run: |
          set -euo pipefail
          nix build .#bot-oci
          # streamLayeredImage output is a script that streams the tar.
          ./result | docker load
          docker tag "${IMAGE}:latest" "${AR_REPO}/${IMAGE}:${GITHUB_SHA}"

      # scripts/smoke-test-image.nu: the binary must reach its own config
      # parsing; distinguishes a hang from a crash.
      - name: Smoke-test the image
        run: nix run .#smoke-test-image -- "${AR_REPO}/${IMAGE}:${GITHUB_SHA}"

      - name: Push image and resolve digest
        id: push
        run: |
          set -euo pipefail
          docker push "${AR_REPO}/${IMAGE}:${GITHUB_SHA}"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${AR_REPO}/${IMAGE}:${GITHUB_SHA}")
          echo "Pushed: ${DIGEST}"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "sha256=${DIGEST##*@}" >> "$GITHUB_OUTPUT"

      # Two independent provenance proofs: the GitHub/Sigstore attestation is
      # non-blocking (needs a paid plan on private repos); the KMS/BinAuthz
      # attestation below is the one the VM's roll timer verifies and MUST
      # succeed.
      - name: Attest build provenance (GitHub / Sigstore)
        continue-on-error: true
        uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4  # v4.2.2
        with:
          subject-name: ${{ env.AR_REPO }}/${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.sha256 }}

      # Signs with whichever key version the attestor currently lists, so a
      # key rotation on the devops side needs no change here. Nix image
      # builds are reproducible, so a push that does not change the image
      # reproduces its digest, and sign-and-create 409s on the existing
      # (attestor, digest) occurrence; tolerating that is sound, the
      # attestation the VM verifies is already in place. Detected from the
      # error text: the deployer may attach occurrences but cannot list
      # them, and a denied list would look like an empty one.
      - name: Sign Binary Authorization attestation
        run: |
          set -euo pipefail
          # The attestor reports the key as a full resource URL
          # (//cloudkms.googleapis.com/v1/projects/...); --keyversion wants
          # the bare resource name.
          KEY_VERSION=$(gcloud container binauthz attestors describe issuance-image \
            --project=s01-artifacts \
            --format='value(userOwnedGrafeasNote.publicKeys[0].id)')
          KEY_VERSION="${KEY_VERSION#//cloudkms.googleapis.com/v1/}"
          case "$KEY_VERSION" in
            projects/s01-artifacts/locations/*/cryptoKeyVersions/*) ;;
            *) echo "::error::could not resolve the attestor's key version (got '${KEY_VERSION}')"; exit 1 ;;
          esac
          if ! output=$(gcloud beta container binauthz attestations sign-and-create \
            --project="s01-artifacts" \
            --artifact-url="${{ steps.push.outputs.digest }}" \
            --attestor="${ATTESTOR}" \
            --keyversion="${KEY_VERSION}" 2>&1); then
            printf '%s\n' "$output"
            grep -q "is the subject of a conflict" <<<"$output" || exit 1
            echo "Attestation already exists for ${{ steps.push.outputs.digest }}; skipping"
          fi

  # STAGING ROLLS ON EVERY MAIN MERGE: the shared app-release workflow in
  # bot-vm mode, as issuance-deployer, no PAM (staging is the fast path).
  # validate_command stays empty for now: validate-config parses the whole
  # environment (secrets included), so it cannot judge the TOML alone; boot
  # is the gate until the binary grows a config-only validation mode.
  roll-staging:
    needs: build-push
    permissions:
      id-token: write
      contents: read
    uses: ST0x-Technology/.github/.github/workflows/app-release.yml@16aab8c5db9e2a4e70dba4b1af73d3c9336c6816  # app-release @ .github main
    with:
      environment: staging
      runtime: bot-vm
      project: s01-issuance-staging
      config_bucket: s01-issuance-staging-config
      ar_repo: europe-west3-docker.pkg.dev/s01-artifacts/s01-issuance
      images: s01-issuance=BOT_IMAGE
      attestor: projects/s01-artifacts/attestors/issuance-image
      service_account: issuance-deployer@s01-artifacts.iam.gserviceaccount.com
      wif_provider: projects/47686631938/locations/global/workloadIdentityPools/github-actions/providers/github-oidc
      image_tag: ${{ github.sha }}
      config_file: config.staging.toml
      config_secret: issuance-runtime-config
