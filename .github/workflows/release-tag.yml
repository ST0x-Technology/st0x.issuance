name: release-tag

# Promote-on-tag: steady main -> push a vX.Y.Z tag -> the tagged artifact
# exists. The shared release-label workflow labels the image main CI already
# built and attested for that commit (verify first, label second, cut the
# GitHub release) as issuance-labeler, an identity that structurally cannot
# push. Then the shared app-release workflow deploys that version to
# production as issuance-releaser, behind the production project's
# app-deploy PAM grant: an approver reads the justification (old -> new
# digest and config version) in the GCP console and activates the grant; the
# VM still verifies the attestation of everything it adopts.
#
# Production is enabled once the production stack exists on the devops side
# (the deploy job is a no-op until then: the releaser SA and the gate are
# created there).

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  label:
    permissions:
      id-token: write
      contents: write
    uses: ST0x-Technology/.github/.github/workflows/release-label.yml@16aab8c5db9e2a4e70dba4b1af73d3c9336c6816  # release-label @ .github main
    with:
      service_account: issuance-labeler@s01-artifacts.iam.gserviceaccount.com
      ar_repo: europe-west3-docker.pkg.dev/s01-artifacts/s01-issuance
      images: s01-issuance
      attestor: projects/s01-artifacts/attestors/issuance-image
      wif_provider: projects/47686631938/locations/global/workloadIdentityPools/github-actions/providers/github-oidc

  # Same group as production-release.yml, on the deploy job only so the
  # label and the GitHub release never wait behind a production run: the
  # two production entrypoints serialize, so a config-only run cannot
  # capture the live digest before a tag deployment and write it back
  # stale. queue: max keeps every queued run; a queued run still fails at
  # the PAM step while the previous release's grant is ACTIVE, so revoke it
  # in the console and re-run.
  deploy-production:
    needs: label
    if: vars.PRODUCTION_RELEASES_ENABLED == 'true'
    concurrency:
      group: production-release
      cancel-in-progress: false
      queue: max
    permissions:
      id-token: write
      contents: read
    uses: ST0x-Technology/.github/.github/workflows/app-release.yml@16aab8c5db9e2a4e70dba4b1af73d3c9336c6816  # app-release @ .github main
    with:
      environment: production
      runtime: bot-vm
      project: s01-issuance
      config_bucket: s01-issuance-config
      ar_repo: europe-west3-docker.pkg.dev/s01-artifacts/s01-issuance
      images: s01-issuance=BOT_IMAGE
      attestor: projects/s01-artifacts/attestors/issuance-image
      service_account: issuance-releaser@s01-artifacts.iam.gserviceaccount.com
      wif_provider: projects/47686631938/locations/global/workloadIdentityPools/github-actions/providers/github-oidc
      pam_entitlement: app-deploy
      # The commit that was labeled, even if the tag moves meanwhile.
      ref: ${{ github.sha }}
      config_file: config.prod.toml
      config_secret: issuance-runtime-config
