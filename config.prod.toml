# Production TOML configuration, baked into the st0x-issuance systemd unit as
# `CONFIG=<nix store path>` (see nix/upgradeable-services.nix).
#
# Deliberately dark: `default_vault_mode = "vault_direct"` and no
# [assets.<SYM>] overrides means every asset runs vault-direct on every chain.
# See config.example.toml for the full schema and the per-asset orchestrator
# rollout knobs.
#
# Parsing is strict — unknown keys and invalid vault_mode strings are startup
# errors, and any asset resolving to orchestrator mode while
# [orchestrator.addresses] is missing or malformed is a startup error.

[orchestrator]
# Restates the implicit default so the [orchestrator] section below cannot be
# misread as an enablement: nothing here moves an asset off the vault-direct
# mint/burn path.
default_vault_mode = "vault_direct"

# ST0xOrchestrator, one deployment per chain at the same pinned address. Only
# Robinhood Chain (4663) is recorded so far; the other chains' entries land
# with their own cutovers.
#
# Verified live on Robinhood: eip712Domain() answers name "ST0xOrchestrator",
# version "1", chainId 4663, verifyingContract equal to this address, and the
# deployed code hashes equal to Base's instance.
#
# Recording the address stays inert until an asset resolves to orchestrator
# mode (`VaultModeConfig::mode_for` is the only reader), so this is the
# onboarding tooling's source of truth ahead of the first cutover, not a live
# dependency of the mint/burn path.
[orchestrator.addresses]
robinhood = "0x3A7387a484d87Aa8bBA45E98AAB401Ce4FBF03E2"

# Wrapped-token (ERC-4626 wrapper) contracts watched for inbound transfers to
# the issuer wallet, which cannot be redeemed and so are alerted on instead
# (SPEC.md "Per network monitoring"). Observe-only: watching a wrapper changes
# nothing about how the underlying is minted or burned.
#
# Every address below was read on-chain against
# https://rpc.mainnet.chain.robinhood.com and returned
# `symbol() == "wt<UNDERLYING>"`.
#
# ORDERING CONSTRAINT: startup rejects a [wrapped_tokens.<network>] table for a
# chain with no chain configuration, so this table is only valid once the
# CHAIN_ROBINHOOD_* group is in the deployment secrets. Roll the secrets first;
# see docs/runbooks/robinhood-vault-registration.md.
